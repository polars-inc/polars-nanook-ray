name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      compute-version:
        description: Version of the polars-nanook-compute package to test against
        required: false
        type: string

env:
  COMPUTE_VERSION: ${{ inputs.compute-version }}

concurrency:
  cancel-in-progress: true
  group: ${{ github.WORKFLOW }}-${{ github.REF }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  integration:
    # name kept from the former runtime matrix, which required checks refer to
    name: integration (subprocess)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Check out codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # https://github.com/marketplace/actions/astral-sh-setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          cache-python: true
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          python-version: "3.12"

      - name: Materialize the license
        run: |
          mkdir --parents _etc
          echo "$LICENSE" > _etc/license.json
        env:
          LICENSE: ${{ secrets.LICENSE }}

      - name: Install dependencies
        run: |
          make .venv
          source .venv/bin/activate
          uv pip install pytest-github-actions-annotate-failures
          if [[ -n "$COMPUTE_VERSION" ]]; then
            uv pip install "polars-nanook-compute==$COMPUTE_VERSION"
          fi

      - name: Run integration tests
        run: |
          make test
        timeout-minutes: 10

